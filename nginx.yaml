services:
  memcached:
    extends:
      file: compose.yaml
      service: memcached

  #redis:
  #  extends:
  #    file: compose.yaml
  #    service: redis

  # ftp:
  #   extends:
  #     file: compose.yaml
  #     service: ftp

  # mysql:
  #   extends:
  #     file: compose.yaml
  #     service: mysql

  mysql:
    extends:
      file: compose.yaml
      service: mysql

  adminer:
    extends:
      file: compose.yaml
      service: adminer

  php-fpm:
    extends:
      file: compose.yaml
      service: php-fpm

  smf:
    extends:
      file: compose.yaml
      service: smf

  nginx:
    image: bitnami/nginx
    container_name: ${APP_NAME}_nginx
    restart: always
    ports:
      - 8088:8080
      - 8443:8443
    volumes:
      - ./_docker/nginx:/opt/bitnami/nginx/conf/server_blocks:ro
      #- ./_docker/certs:/certs
      - web:/app
      #- ./src:/app
    depends_on:
      - mysql
      - smf

volumes:
  redis:
  mysql:
  pgsql:
  web:
